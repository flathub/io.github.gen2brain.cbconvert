app-id: io.github.gen2brain.cbconvert
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang

command: cbconvert-gui

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=host

build-options:
  env:
    - GOROOT=/usr/lib/sdk/golang
    - GOTOOLCHAIN=local

cleanup:
  - '/include'
  - '/lib/cmake'
  - '/lib/pkgconfig'

modules:

  - name: CBconvert
    buildsystem: simple
    subdir: cmd/cbconvert-gui
    build-commands:
      - cp dist/linux/modules.txt vendor/
      - rm -f ../../go.work ../../go.work.sum ../../go.mod ../../go.sum
      - $GOROOT/bin/go build -mod=vendor -trimpath -ldflags "-s -w -X main.appVersion=1.2.0" .
      - install -Dm00755 cbconvert-gui /app/bin/cbconvert-gui
      - install -Dm00644 dist/linux/$FLATPAK_ID.png /app/share/icons/hicolor/256x256/apps/$FLATPAK_ID.png
      - install -Dm00644 dist/linux/$FLATPAK_ID.desktop /app/share/applications/$FLATPAK_ID.desktop
      - install -Dm00644 dist/linux/$FLATPAK_ID.metainfo.xml /app/share/metainfo/$FLATPAK_ID.metainfo.xml
      - install -d /app/lib
      - ln -sf /usr/lib/$FLATPAK_ARCH-linux-gnu/libjxl.so.0.11 /app/lib/libjxl.so
      - ln -sf /usr/lib/$FLATPAK_ARCH-linux-gnu/libwebp.so.7 /app/lib/libwebp.so
      - ln -sf /usr/lib/$FLATPAK_ARCH-linux-gnu/libwebpdemux.so.2 /app/lib/libwebpdemux.so
      - ln -sf /usr/lib/$FLATPAK_ARCH-linux-gnu/libavif.so.16 /app/lib/libavif.so
